<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HisabSaathi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#133d38">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f6f7f6;color:#1d2b29}
header{background:#133d38;color:#fff;padding:12px 14px}header h1{margin:0;font-size:20px}header small{opacity:.8}
.modes{display:flex;gap:8px;margin-top:8px}.modes button{border:1px solid #fff;background:none;color:#fff;border-radius:20px;padding:6px 14px}
.modes button.on{background:#fff;color:#133d38;font-weight:600}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:2}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:13px}nav button.on{border-bottom:3px solid #133d38;font-weight:700}
main{padding:12px;max-width:900px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.card,.box{background:#fff;border:1px solid #e2e5e3;border-radius:12px;padding:12px;margin-bottom:12px}
.cards .card{margin:0;padding:10px}.cards small{font-size:11px;color:#667}.cards b{display:block;font-size:17px;margin-top:4px}
.in{color:#0a7a55}.out{color:#b3322f}
label{font-size:12px;color:#556;display:block;margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid #ccd;border-radius:8px;font-size:15px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{width:100%;background:#133d38;color:#fff;border:0;border-radius:8px;padding:13px;font-size:16px;margin-top:12px}
.btn.s{width:auto;padding:8px 12px;font-size:13px;margin:0}.btn.g{background:#25a244}.btn.r{background:#b3322f}
.tg button{flex:1;padding:10px;border:1px solid #ccd;background:#fff;border-radius:8px}.tg button.on{background:#e3f3ee;border-color:#133d38;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips button{border:1px solid #ccd;background:#fff;border-radius:16px;padding:6px 12px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.tx small{color:#667;display:block}.x{border:0;background:none;color:#b3322f;font-size:18px}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:10px}.bars i{display:block;background:#133d38;border-radius:4px 4px 0 0;min-height:2px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.done{opacity:.55}
#rep{display:none}@media print{body.pr>*:not(#rep){display:none!important}body.pr #rep{display:block}}
</style></head><body>
<header style="position:relative"><button id="lg" onclick="setLang(db.lang==='hi'?'en':'hi')" style="position:absolute;right:12px;top:12px;border:1px solid #fff;background:none;color:#fff;border-radius:16px;padding:5px 12px"></button><h1><img id="hl" style="height:26px;border-radius:6px;vertical-align:middle;display:none"> <span id="hn">₹ HisabSaathi</span></h1><small>Roz ka hisaab, bina tension</small>
<div class="modes"><button id="m-me" onclick="setMode('me')">👤 Personal</button><button id="m-shop" onclick="setMode('shop')">🏪 Shopkeeper</button></div></header>
<nav id="nav"></nav><main id="main"></main><div id="rep"></div>
<div id="lk" style="display:none;position:fixed;inset:0;background:#133d38;z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff"><h2>🔒 HisabSaathi</h2><input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="width:160px;text-align:center"><button class="btn" style="width:160px;background:#fff;color:#133d38" onclick="unlock()">Unlock</button><small id="le"></small></div>
<script>
const $=s=>document.querySelector(s),K='hs_v2';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{tx:[],ud:[],items:['Tel','Surf','Chay','Sabun','Atta','Chini']};
db.shop=db.shop||{};db.lang=db.lang||'en';
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const ld=(o=0)=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4-o*864e5).toISOString().slice(0,10);
const S={mode:'shop',view:'home',type:'in',month:ld().slice(0,7),q:'',ft:'',fp:''};
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={shop:{in:['Customer payment','Other income'],out:['Stock purchase','Rent','Salary','Electricity','Transport','Other']},me:{in:['Salary','Other income'],out:['Food','Travel','Bills','Shopping','Other']}};
const opts=()=>CATS[S.mode][S.type].map(c=>`<option>${c}</option>`).join('');
const bal=u=>u.amt-u.paid.reduce((s,p)=>s+p.a,0);
const mine=()=>db.tx.filter(t=>t.mode===S.mode);
const sum=a=>a.reduce((s,t)=>s+t.amt,0);

function setMode(m){S.mode=m;S.type='in';if(m==='me'&&S.view==='ud')S.view='home';render()}
function setView(v){S.view=v;render()}
function setType(t){S.type=t;$('#t-in').className=t==='in'?'on':'';$('#t-out').className=t==='out'?'on':'';$('#cat').innerHTML=opts()}
function qi(n){$('#desc').value=n;$('#amt').focus()}
function addItem(){const n=prompt('Naya item ka naam?');if(n&&n.trim()){db.items.push(n.trim());save();render()}}

function add(){const a=parseFloat($('#amt').value);if(!(a>0))return alert('Amount daalo');
const o={mode:S.mode,type:S.type,amt:a,pay:$('#pay').value,cat:$('#cat').value,desc:$('#desc').value.trim(),date:$('#dt').value||ld()},e=S.edit&&db.tx.find(x=>x.id===S.edit);if(e)Object.assign(e,o);else db.tx.push({id:Date.now(),...o});
save();render()}
function del(id){if(confirm('Ye entry delete karein?')){db.tx=db.tx.filter(t=>t.id!==id);save();render()}}

function drawList(){const q=S.q.toLowerCase();
const l=mine().filter(t=>t.date.startsWith(S.month)&&(!S.ft||t.type===S.ft)&&(!S.fp||t.pay===S.fp)&&(t.desc+' '+t.cat).toLowerCase().includes(q))
.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
$('#list').innerHTML=l.length?l.map(t=>`<div class="tx"><div><b>${esc(t.desc||t.cat)}</b><small>${t.date} · ${t.pay} · ${esc(t.cat)}</small></div>
<div><b class="${t.type}">${t.type==='in'?'+':'-'}${inr(t.amt)}</b> <button class="x" style="color:#25a244" onclick="bill(${t.id})">📤</button><button class="x" style="color:#556" onclick="edit(${t.id})">✏️</button><button class="x" onclick="del(${t.id})">×</button></div></div>`).join(''):'<small>Koi entry nahi mili</small>'}
function filt(k,v){S[k]=v;drawList();tr()}

function home(){const m=mine().filter(t=>t.date.startsWith(S.month)),i=sum(m.filter(t=>t.type==='in')),o=sum(m.filter(t=>t.type==='out'));
const shop=S.mode==='shop';
return `<div class="row" style="align-items:center;margin-bottom:8px"><b>${shop?'Shop':'Personal'} Monthly Overview</b><input type="month" value="${S.month}" onchange="S.month=this.value;render()"></div>
<div class="cards"><div class="card"><small>${shop?'Business expenses':'Kharch'}</small><b class="out">${inr(o)}</b></div>
<div class="card"><small>${shop?'Total sales':'Aaya'}</small><b class="in">${inr(i)}</b></div>
<div class="card"><small>Net</small><b>${inr(i-o)}</b></div></div>
<div class="box"><b>Add entry</b>
<div class="row tg" style="margin-top:8px"><button id="t-out" onclick="setType('out')">− Expense / Kharch</button><button id="t-in" class="on" onclick="setType('in')">+ Income / Aaya</button></div>
${shop?`<label>Quick item</label><div class="chips">${db.items.map(n=>`<button onclick="qi('${esc(n).replace(/'/g,'')}')">${esc(n)}</button>`).join('')}<button onclick="addItem()">+ item</button></div>`:''}
<label>Amount (₹) *</label><input id="amt" type="number" inputmode="decimal" placeholder="e.g. 250">
<div class="row"><div><label>Payment mode</label><select id="pay"><option>Cash</option><option>UPI</option><option>Card</option></select></div>
<div><label>Category</label><select id="cat">${opts()}</select></div></div>
<label>Description (optional)</label><input id="desc" placeholder="e.g. Tel, Surf">
<label>Date</label><input id="dt" type="date" value="${ld()}">
<button class="btn" onclick="add()">+ Save entry</button></div>
<div class="box"><b>Transactions</b>
<div class="row" style="margin-top:8px"><input placeholder="Search" oninput="filt('q',this.value)">
<select onchange="filt('ft',this.value)"><option value="">All types</option><option value="in">Income</option><option value="out">Expense</option></select>
<select onchange="filt('fp',this.value)"><option value="">All modes</option><option>Cash</option><option>UPI</option><option>Card</option></select></div>
<div id="list"></div></div>`}

function grp(){const g={};db.ud.forEach(u=>{const k=u.name.trim().toLowerCase(),c=g[k]=g[k]||{name:u.name,phone:'',list:[]};c.list.push(u);if(u.phone)c.phone=u.phone});
return Object.values(g).map(c=>({...c,bal:c.list.reduce((s,u)=>s+bal(u),0)})).sort((a,b)=>b.bal-a.bal)}
function udView(){const G=grp(),tot=G.reduce((s,c)=>s+c.bal,0),open=G.filter(c=>c.bal>0).length;
return `<div class="card"><small>Total udhaar baaki (${open} log)</small><b class="out" style="font-size:22px">${inr(tot)}</b></div>
<div class="box"><b>Naya udhaar</b><label>Customer ka naam *</label><input id="un"><label>WhatsApp number (10 digit)</label><input id="up" type="tel">
<label>Amount (₹) *</label><input id="ua" type="number" inputmode="decimal"><label>Note</label><input id="uo" placeholder="e.g. Atta, Tel">
<button class="btn" onclick="addUd()">+ Udhaar likho</button></div>
${G.map((c,i)=>`<div class="box ${c.bal<=0?'done':''}"><div class="row" style="align-items:center"><b>${esc(c.name)}</b><b class="out" style="text-align:right">${c.bal<=0?'Cleared ✓':inr(c.bal)}</b></div>
<div class="acts">${c.bal>0?`<button class="btn s" onclick="recvC(${i})">Payment mila</button><button class="btn s g" onclick="waC(${i})">WhatsApp reminder</button>`:''}<button class="btn s" style="background:#556" onclick="fillUd(${i})">+ Udhaar</button></div>
<details style="margin-top:8px"><summary><small>History (${c.list.length})</small></summary>${c.list.map(u=>`<div class="tx"><div>${u.date} · ${esc(u.note)}<small>Udhaar ${inr(u.amt)}${u.paid.map(p=>' · mila '+inr(p.a)+' ('+p.d+')').join('')}</small></div><button class="x" onclick="delUd(${u.id})">×</button></div>`).join('')}</details></div>`).join('')}`}
function recvC(i){const c=grp()[i],a=parseFloat(prompt(`${c.name} se kitna mila? (baaki ${c.bal})`));if(!(a>0))return;if(a>c.bal)return alert('Baaki se zyada nahi');
let left=a;c.list.slice().sort((x,y)=>x.id-y.id).forEach(u=>{const t=Math.min(bal(u),left);if(t>0){u.paid.push({a:t,d:ld()});left-=t}});
db.tx.push({id:Date.now(),mode:'shop',type:'in',amt:a,pay:'Cash',cat:'Udhaar recovery',desc:'Udhaar: '+c.name,date:ld()});save();render()}
function waC(i){const c=grp()[i];let p=c.phone;if(p.length===10)p='91'+p;
open('https://wa.me/'+p+'?text='+encodeURIComponent(`Namaste ${c.name}, aapka ${inr(c.bal)} udhaar baaki hai. Kripya jald de dein. Dhanyawad 🙏`))}
function fillUd(i){const c=grp()[i];$('#un').value=c.name;$('#up').value=c.phone;$('#ua').focus();$('#un').scrollIntoView()}
function addUd(){const n=$('#un').value.trim(),a=parseFloat($('#ua').value);if(!n||!(a>0))return alert('Naam aur amount daalo');
db.ud.push({id:Date.now(),name:n,phone:$('#up').value.replace(/\D/g,''),amt:a,note:$('#uo').value.trim(),date:ld(),paid:[]});save();render()}
function recv(id){const u=db.ud.find(x=>x.id===id),a=parseFloat(prompt(`${u.name} se kitna mila? (baaki ${bal(u)})`));
if(!(a>0))return;if(a>bal(u))return alert('Baaki se zyada nahi');u.paid.push({a,d:ld()});
db.tx.push({id:Date.now(),mode:'shop',type:'in',amt:a,pay:'Cash',cat:'Udhaar recovery',desc:'Udhaar: '+u.name,date:ld()});save();render()}
function wa(id){const u=db.ud.find(x=>x.id===id);let p=u.phone;if(p.length===10)p='91'+p;
const msg=`Namaste ${u.name}, aapka ${inr(bal(u))} udhaar baaki hai. Kripya jald de dein. Dhanyawad 🙏`;
open('https://wa.me/'+p+'?text='+encodeURIComponent(msg))}
function delUd(id){if(confirm('Ye udhaar delete karein?')){db.ud=db.ud.filter(u=>u.id!==id);save();render()}}

function summary(){const t=mine(),td=t.filter(x=>x.date===ld()),inc=td.filter(x=>x.type==='in');
const days=[...Array(7)].map((_,k)=>{const d=ld(6-k);return{d:d.slice(5),v:sum(t.filter(x=>x.date===d&&x.type==='in'))}}),mx=Math.max(1,...days.map(x=>x.v));
return `<div class="box"><b>Aaj ka hisaab (${ld()})</b><div class="cards" style="margin-top:8px"><div class="card"><small>Aaya</small><b class="in">${inr(sum(inc))}</b></div>
<div class="card"><small>Gaya</small><b class="out">${inr(sum(td.filter(x=>x.type==='out')))}</b></div><div class="card"><small>Bacha</small><b>${inr(sum(inc)-sum(td.filter(x=>x.type==='out')))}</b></div></div>
<div class="row"><div class="card"><small>Cash aaya</small><b>${inr(sum(inc.filter(x=>x.pay==='Cash')))}</b></div><div class="card"><small>UPI aaya</small><b>${inr(sum(inc.filter(x=>x.pay==='UPI')))}</b></div></div></div>
<div class="box"><b>Pichhle 7 din ki kamai</b><div class="bars">${days.map(x=>`<div><small>${x.v?Math.round(x.v):''}</small><i style="height:${x.v/mx*90}px"></i>${x.d}</div>`).join('')}</div></div>
${S.mode==='shop'?`<div class="card"><small>Udhaar baaki</small><b class="out">${inr(db.ud.reduce((s,u)=>s+bal(u),0))}</b></div>`:''}`}

function dl(n,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=n;a.click()}
const bk=()=>dl('hisabsaathi-backup-'+ld()+'.json',JSON.stringify(db),'application/json');
function csv(){const r=[['Date','Type','Amount','Mode','Category','Description'],...mine().map(t=>[t.date,t.type,t.amt,t.pay,t.cat,t.desc])];
dl('hisab-'+S.mode+'.csv',r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;
if(confirm('Purana data replace hoga. Sure?')){db={tx:d.tx,ud:d.ud||[],items:d.items||db.items,shop:d.shop||db.shop,lang:db.lang};save();render();alert('Restore ho gaya ✓')}}catch(e){alert('Galat backup file')}};r.readAsText(f)}
const backup=()=>`<div class="box"><b>Backup & Restore</b><p><small>Data sirf is phone ke browser me hai. Hafte me ek baar backup zaroor lein, aur file WhatsApp/Drive pe save karein.</small></p>
<button class="btn" onclick="bk()">⬇ Backup download (JSON)</button><label>Backup se restore</label><input type="file" accept=".json" onchange="imp(this.files[0])">
<button class="btn" style="background:#556" onclick="csv()">Export CSV (Excel ke liye)</button>
<button class="btn" style="background:#8a5a00" onclick="report()">📄 Monthly PDF report</button><small>Home me jo mahina chuna hai, uska report banega. Print screen me "Save as PDF" chuno.</small></div>`;

function render(){S.edit=null;
$('#m-me').className=S.mode==='me'?'on':'';$('#m-shop').className=S.mode==='shop'?'on':'';
const tabs=[['home','🏠 Home'],...(S.mode==='shop'?[['ud','📒 Udhaar']]:[]),['sum','📊 Summary'],['bk','💾 Backup'],['set','⚙️ Shop']];
$('#nav').innerHTML=tabs.map(([v,l])=>`<button class="${S.view===v?'on':''}" onclick="setView('${v}')">${l}</button>`).join('');
$('#main').innerHTML={home,ud:udView,sum:summary,bk:backup,set:settings}[S.view]();
if(S.view==='home')drawList();hdr();tr()}
const HI={'Roz ka hisaab, bina tension':'रोज़ का हिसाब, बिना टेंशन','👤 Personal':'👤 निजी','🏪 Shopkeeper':'🏪 दुकानदार','🏠 Home':'🏠 होम','📒 Udhaar':'📒 उधार','📊 Summary':'📊 सारांश','💾 Backup':'💾 बैकअप','⚙️ Shop':'⚙️ दुकान',
'Shop Monthly Overview':'दुकान का मासिक हिसाब','Personal Monthly Overview':'मासिक हिसाब','Business expenses':'दुकान का खर्च','Kharch':'खर्च','Total sales':'कुल बिक्री','Aaya':'आया','Net':'बचत','Add entry':'एंट्री जोड़ें','− Expense / Kharch':'− खर्च','+ Income / Aaya':'+ आमदनी','Quick item':'जल्दी चुनें','+ item':'+ आइटम','Amount (₹) *':'रकम (₹) *','Payment mode':'भुगतान का तरीका','Category':'श्रेणी','Description (optional)':'विवरण (वैकल्पिक)','Date':'तारीख','+ Save entry':'+ सेव करें','Transactions':'लेन-देन','Koi entry nahi mili':'कोई एंट्री नहीं मिली',
'Naya udhaar':'नया उधार','Customer ka naam *':'ग्राहक का नाम *','WhatsApp number (10 digit)':'WhatsApp नंबर (10 अंक)','Amount (₹) *':'रकम (₹) *','Note':'नोट','+ Udhaar likho':'+ उधार लिखें','Payment mila':'पैसे मिले','WhatsApp reminder':'WhatsApp याद दिलाएं','Delete':'हटाएं','Cleared ✓':'चुकता ✓',
'Aaj ka hisaab':'आज का हिसाब','Pichhle 7 din ki kamai':'पिछले 7 दिन की कमाई','Gaya':'गया','Bacha':'बचा','Cash aaya':'नकद आया','UPI aaya':'UPI आया','Udhaar baaki':'उधार बाकी',
'Backup & Restore':'बैकअप और रिस्टोर','⬇ Backup download (JSON)':'⬇ बैकअप डाउनलोड','Backup se restore':'बैकअप से रिस्टोर','Export CSV (Excel ke liye)':'CSV एक्सपोर्ट (Excel के लिए)','📄 Monthly PDF report':'📄 मासिक PDF रिपोर्ट',
'Shop details':'दुकान की जानकारी','Shop ka naam':'दुकान का नाम','Logo':'लोगो','Save':'सेव करें','UPI QR code':'UPI QR कोड','Tumhara UPI ID':'आपका UPI ID','QR banao':'QR बनाएं','e.g. 250':'जैसे 250','Search':'खोजें'};
function tr(){const hi=db.lang==='hi',w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
while(n=w.nextNode()){const p=n.parentNode.tagName;if(p==='OPTION'||p==='SCRIPT')continue;if(n._o===undefined)n._o=n.nodeValue;const k=n._o.trim();n.nodeValue=hi&&HI[k]?n._o.replace(k,HI[k]):n._o}
if(hi)document.querySelectorAll('[placeholder]').forEach(e=>{const k=e.placeholder;if(HI[k])e.placeholder=HI[k]})}
function setLang(l){db.lang=l;save();render()}
function hdr(){const s=db.shop;$('#hn').textContent=s.name||(s.logo?'HisabSaathi':'₹ HisabSaathi');const l=$('#hl');l.style.display=s.logo?'inline-block':'none';if(s.logo)l.src=s.logo;$('#lg').textContent=db.lang==='hi'?'EN':'हिं'}
const settings=()=>{const s=db.shop;return `<div class="box"><b>Shop details</b><label>Shop ka naam</label><input id="sn" value="${esc(s.name)}"><label>Logo</label><input type="file" accept="image/*" onchange="logo(this.files[0])">${s.logo?`<img src="${s.logo}" width="64" style="margin-top:8px;border-radius:12px">`:''}<button class="btn" onclick="saveShop()">Save</button></div>
<div class="box"><b>UPI QR code</b><label>Tumhara UPI ID</label><input id="su" value="${esc(s.upi)}" placeholder="name@bank"><button class="btn" onclick="mkQR()">QR banao</button><div style="text-align:center;margin-top:12px">${s.qr?`<img src="${s.qr}" width="220"><br><small>Customer ye QR scan karke seedha tumhare UPI par pay karega</small>`:''}</div></div>
<div class="box"><b>Language / भाषा</b><div class="row tg" style="margin-top:8px"><button class="${db.lang!=='hi'?'on':''}" onclick="setLang('en')">English</button><button class="${db.lang==='hi'?'on':''}" onclick="setLang('hi')">हिन्दी</button></div></div>`+pinBox()};
function saveShop(){db.shop.name=$('#sn').value.trim();save();render()}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(128/i.width,128/i.height,1);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.shop.logo=c.toDataURL('image/png');save();render()};i.src=r.result};r.readAsDataURL(f)}
function mkQR(){const u=$('#su').value.trim();if(!/^[\w.\-]+@[\w.\-]+$/.test(u))return alert('Sahi UPI ID daalo, jaise name@okbank');db.shop.upi=u;
const go=()=>{const d=document.createElement('div');new QRCode(d,{text:'upi://pay?pa='+u+'&pn='+encodeURIComponent(db.shop.name||'Shop')+'&cu=INR',width:256,height:256});
setTimeout(()=>{const c=d.querySelector('canvas');if(!c)return alert('QR nahi bana, dobara try karo');db.shop.qr=c.toDataURL();save();render()},400)};
if(window.QRCode)go();else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=go;s.onerror=()=>alert('QR banane ke liye ek baar internet chahiye');document.head.appendChild(s)}}
function report(){const m=mine().filter(t=>t.date.startsWith(S.month)).sort((a,b)=>a.date.localeCompare(b.date)),i=sum(m.filter(t=>t.type==='in')),o=sum(m.filter(t=>t.type==='out')),sh=db.shop,ud=S.mode==='shop'?db.ud.filter(u=>bal(u)>0):[];
$('#rep').innerHTML=`<div style="font-family:sans-serif;padding:8px">${sh.logo?`<img src="${sh.logo}" width="56" style="float:right">`:''}<h2 style="margin:0">${esc(sh.name||'HisabSaathi')}</h2><p>Monthly Report: ${S.month}</p>
<p><b>Aaya:</b> ${inr(i)} &nbsp; <b>Gaya:</b> ${inr(o)} &nbsp; <b>Bacha:</b> ${inr(i-o)}</p>
<table width="100%" border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;font-size:13px"><tr><th>Date</th><th>Detail</th><th>Mode</th><th>Aaya</th><th>Gaya</th></tr>${m.map(t=>`<tr><td>${t.date}</td><td>${esc(t.desc||t.cat)}</td><td>${t.pay}</td><td>${t.type==='in'?inr(t.amt):''}</td><td>${t.type==='out'?inr(t.amt):''}</td></tr>`).join('')}</table>
${ud.length?'<h3>Udhaar baaki</h3>'+ud.map(u=>`<div>${esc(u.name)}: ${inr(bal(u))}</div>`).join(''):''}</div>`;
document.body.classList.add('pr');print()}
onafterprint=()=>document.body.classList.remove('pr');

const PK='hs_pin';
async function hp(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hs:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function lock(){if(!localStorage.getItem(PK))return;$('#lk').style.display='flex';$('#lp').value='';$('#le').textContent=''}
async function unlock(){if(await hp($('#lp').value)===localStorage.getItem(PK))$('#lk').style.display='none';else $('#le').textContent='Galat PIN'}
async function setPin(){const p=$('#np').value;if(!/^\d{4}$/.test(p))return alert('4 digit PIN daalo');localStorage.setItem(PK,await hp(p));render()}
function rmPin(){if(confirm('PIN hatana hai?')){localStorage.removeItem(PK);render()}}
const pinBox=()=>localStorage.getItem(PK)?`<div class="box"><b>PIN lock</b><p><small>PIN laga hua hai ✓ (app band karke kholne par PIN maangega)</small></p><button class="btn r" onclick="rmPin()">PIN hatao</button></div>`:`<div class="box"><b>PIN lock</b><label>4 digit PIN</label><input id="np" type="password" inputmode="numeric" maxlength="4"><button class="btn" onclick="setPin()">PIN lagao</button><p><small>PIN bhool gaye to app ka data reset karna padega, isliye Backup lete raho.</small></p></div>`;
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});
function bill(id){const t=db.tx.find(x=>x.id===id),s=db.shop;
open('https://wa.me/?text='+encodeURIComponent(`🧾 *${s.name||'HisabSaathi'}*\nDate: ${t.date}\n${t.desc||t.cat}: ${inr(t.amt)}\nPayment: ${t.pay}\n${s.upi?'UPI: '+s.upi+'\n':''}Dhanyawad, phir aaiyega 🙏`))}
function edit(id){const t=db.tx.find(x=>x.id===id);if(!t)return;setType(t.type);$('#amt').value=t.amt;$('#pay').value=t.pay;
if(![...$('#cat').options].some(o=>o.value===t.cat))$('#cat').add(new Option(t.cat));$('#cat').value=t.cat;$('#desc').value=t.desc;$('#dt').value=t.date;S.edit=id;
document.querySelector('.btn').textContent='✓ Update entry';scrollTo(0,0)}
Object.assign(HI,{'+ Udhaar':'+ उधार','PIN lock':'PIN लॉक','PIN lagao':'PIN लगाओ','PIN hatao':'PIN हटाओ','4 digit PIN':'4 अंक का PIN'});
lock();
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
